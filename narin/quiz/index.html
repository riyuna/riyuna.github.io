<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나린봇 야구퀴즈 - 통산기록</title>
  <style>
    :root {
      --bg: #07111f;
      --surface: #0d1f35;
      --card: #112844;
      --border: #1e3d5c;
      --accent: #4da6ff;
      --accent2: #7ec8ff;
      --text: #e8f4ff;
      --muted: #7aaac8;
      --dim: #4a7a9b;
      --good: #5cb85c;
      --bad: #e05c5c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; line-height: 1.6; }
    header { background: var(--surface); border-bottom: 2px solid var(--accent); padding: 1.2rem 2rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    header h1 { font-size: 1.4rem; color: var(--accent2); letter-spacing: 0.02em; }
    header a.back { color: var(--muted); text-decoration: none; font-size: 0.85rem; border: 1px solid var(--border); padding: 0.3rem 0.8rem; border-radius: 4px; margin-left: auto; }
    header a.back:hover { border-color: var(--accent); color: #fff; }
    .container { max-width: 1180px; margin: 0 auto; padding: 1.6rem 1.2rem 3rem; }

    .intro { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.4rem; }
    .intro b { color: var(--accent2); }

    .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.6rem; margin-bottom: 1.6rem; }
    .cat-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.8rem; text-align: center; cursor: pointer; color: var(--text); font-size: 0.92rem; transition: all 0.15s; }
    .cat-btn:hover { border-color: var(--accent); }
    .cat-btn.active { background: var(--card); border-color: var(--accent); color: var(--accent2); font-weight: bold; }

    #quiz-area { display: none; }
    #quiz-area.show { display: block; }

    .quiz-title-row { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .quiz-title-row .title { font-size: 1.1rem; color: var(--accent2); font-weight: bold; }
    .quiz-title-row .note { color: var(--muted); font-size: 0.82rem; }

    .quiz-layout { display: grid; grid-template-columns: 1fr 280px; gap: 1.2rem; align-items: start; }

    .side-col { position: sticky; top: 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; display: flex; flex-direction: column; gap: 0.7rem; }
    .side-stats { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); }
    .side-stats b { color: var(--text); }

    .guess-row { display: flex; flex-direction: column; gap: 0.5rem; }
    .guess-row input { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 0.65rem 0.9rem; color: var(--text); font-size: 0.95rem; width: 100%; }
    .guess-row input:focus { outline: none; border-color: var(--accent); }
    .guess-row button { background: var(--accent); border: none; border-radius: 6px; padding: 0.65rem 1.1rem; color: #07111f; font-weight: bold; cursor: pointer; font-size: 0.9rem; width: 100%; }
    .guess-row button:hover { background: var(--accent2); }
    .guess-row button.hint-btn { background: var(--card); color: var(--accent2); border: 1px solid var(--border); }
    .guess-row button.hint-btn:hover { border-color: var(--accent); }
    .guess-row button:disabled { opacity: 0.4; cursor: not-allowed; }

    #feedback { min-height: 1.4rem; font-size: 0.85rem; }
    #feedback.ok { color: var(--good); }
    #feedback.bad { color: var(--bad); }

    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
    table.quiz-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; white-space: nowrap; }
    table.quiz-table th, table.quiz-table td { padding: 0.45rem 0.7rem; border-bottom: 1px solid var(--border); text-align: center; }
    table.quiz-table th { background: var(--card); color: var(--accent2); }
    table.quiz-table td.name-col { text-align: left; }
    table.quiz-table tr.solved { background: rgba(92,184,92,0.08); }
    table.quiz-table tr.solved td.name-col { color: var(--good); font-weight: bold; }
    table.quiz-table td.masked { color: var(--dim); }
    table.quiz-table tr.flash-correct { animation: flashGood 0.6s; }
    @keyframes flashGood { from { background: rgba(92,184,92,0.35); } to { background: rgba(92,184,92,0.08); } }

    .pager { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-top: 0.8rem; }
    .pager button { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.9rem; color: var(--text); cursor: pointer; font-size: 0.85rem; }
    .pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent2); }
    .pager button:disabled { opacity: 0.35; cursor: not-allowed; }
    .pager span { color: var(--muted); font-size: 0.85rem; }

    .footer-note { color: var(--dim); font-size: 0.78rem; margin-top: 1.2rem; }
    footer { text-align: center; color: var(--dim); font-size: 0.8rem; padding: 2rem; border-top: 1px solid var(--border); margin-top: 2rem; }

    @media (max-width: 760px) {
      .quiz-layout { grid-template-columns: 1fr; }
      .side-col { position: static; order: -1; }
    }
  </style>
</head>
<body>
<header>
  <h1>⚾ 나린봇 야구퀴즈</h1>
  <span style="color:var(--muted); font-size:0.88rem;">통산기록 TOP100 순위 맞히기</span>
  <a class="back" href="/narin/">← 명령어 안내로</a>
</header>

<div class="container">
  <p class="intro">
    카테고리를 고르면 <b>역대 통산기록 TOP100</b> 표가 뜬다. 이름은 가려져 있고, 순위·기록만 보인다.
    선수 이름을 맞히면 그 줄이 공개된다. 공동 순위는 한 명씩 따로 맞혀야 한다. 힌트를 쓰면 컬럼이 하나씩 열린다.<br>
    데이터 기준일: <b id="snapshot-date">-</b> (나린봇 DB 스냅샷)
  </p>

  <div class="cat-grid" id="cat-grid"></div>

  <div id="quiz-area">
    <div class="quiz-title-row">
      <div class="title" id="quiz-title"></div>
      <div class="note" id="asc-note"></div>
    </div>

    <div class="quiz-layout">
      <div class="table-col">
        <div class="table-wrap">
          <table class="quiz-table">
            <thead><tr id="table-head"></tr></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
        <div class="pager">
          <button id="prev-page">◀ 이전</button>
          <span id="page-indicator">1 / 1</span>
          <button id="next-page">다음 ▶</button>
        </div>
      </div>

      <div class="side-col">
        <div class="side-stats">
          <span>정답 <b id="solved-count">0</b>/<span id="total-count">0</span></span>
          <span>힌트 <b id="hint-left">3</b>회 남음</span>
        </div>
        <div class="guess-row">
          <input type="text" id="guess-input" placeholder="선수 이름 입력 후 Enter" autocomplete="off">
          <button id="guess-btn">제출</button>
          <button id="hint-btn" class="hint-btn">힌트 보기</button>
        </div>
        <div id="feedback"></div>
      </div>
    </div>

    <p class="footer-note">전체 정답을 다 맞히면 완료. 새로고침하면 그 카테고리는 다시 시작된다 (로컬 진행상황 저장 없음).</p>
  </div>
</div>

<footer>
  나린봇 · KBO 야구 디스코드 봇 · <a href="https://github.com/riyuna/narin_bot" style="color:var(--accent)">GitHub</a>
</footer>

<script>
(function () {
  var DATA = null;
  var current = null; // { key, def, nameToSlots }
  var solvedCount = 0;
  var hintCount = 0;
  var MAX_HINTS = 3;
  var revealedCols = new Set();
  var PAGE_SIZE = 25;
  var currentPage = 0;

  function normalize(name) {
    return name.replace(/\s+/g, '').toLowerCase();
  }

  function loadData() {
    return fetch('/narin/quiz/data.json?t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (json) {
        DATA = json;
        document.getElementById('snapshot-date').textContent = json.snapshot_at || '-';
        renderCategoryGrid();
      })
      .catch(function () {
        document.getElementById('cat-grid').innerHTML = '<p style="color:var(--bad)">데이터를 불러오지 못했습니다.</p>';
      });
  }

  function renderCategoryGrid() {
    var grid = document.getElementById('cat-grid');
    grid.innerHTML = '';
    Object.keys(DATA.categories).forEach(function (key) {
      var def = DATA.categories[key];
      var btn = document.createElement('div');
      btn.className = 'cat-btn';
      btn.textContent = def.label;
      btn.dataset.key = key;
      btn.addEventListener('click', function () { startQuiz(key); });
      grid.appendChild(btn);
    });
  }

  function startQuiz(key) {
    var def = DATA.categories[key];
    if (!def) return;

    document.querySelectorAll('.cat-btn').forEach(function (b) {
      b.classList.toggle('active', b.dataset.key === key);
    });

    var nameToSlots = {};
    def.slots.forEach(function (slot) {
      slot.players.forEach(function (p) {
        var k = normalize(p.name);
        if (!nameToSlots[k]) nameToSlots[k] = [];
        nameToSlots[k].push(slot.slot_id);
      });
      slot.solved = false;
    });

    current = { key: key, def: def, nameToSlots: nameToSlots };
    solvedCount = 0;
    hintCount = 0;
    revealedCols = new Set();
    currentPage = 0;

    document.getElementById('quiz-area').classList.add('show');
    document.getElementById('quiz-title').textContent = def.label + ' TOP ' + def.slots.length;
    document.getElementById('total-count').textContent = def.slots.length;
    document.getElementById('solved-count').textContent = '0';
    document.getElementById('hint-left').textContent = MAX_HINTS;
    document.getElementById('asc-note').textContent = def.order_type === 'ASC' ? '(낮을수록 1위)' : '';
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = '';
    document.getElementById('guess-input').value = '';
    document.getElementById('guess-input').focus();
    document.getElementById('hint-btn').disabled = false;

    renderTable();
    document.getElementById('quiz-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function totalPages() {
    return Math.max(1, Math.ceil(current.def.slots.length / PAGE_SIZE));
  }

  function currentPageSlots() {
    var start = currentPage * PAGE_SIZE;
    return current.def.slots.slice(start, start + PAGE_SIZE);
  }

  function renderTable() {
    var def = current.def;
    var head = document.getElementById('table-head');
    head.innerHTML = '<th>순위</th>' + def.hint_cols.map(function (c) { return '<th>' + c.label + '</th>'; }).join('') + '<th>선수</th>';

    var body = document.getElementById('table-body');
    body.innerHTML = '';
    currentPageSlots().forEach(function (slot) {
      var tr = document.createElement('tr');
      tr.id = 'slot-' + slot.slot_id;
      if (slot.solved) tr.classList.add('solved');

      var cells = '<td>' + slot.rank_display + '</td>';
      def.hint_cols.forEach(function (c) {
        var shown = slot.solved || revealedCols.has(c.key);
        var val = c.key === 'team' ? slot.players[0].team
          : (slot.players[0].stats[c.key] != null ? slot.players[0].stats[c.key] : '-');
        cells += shown ? '<td>' + val + '</td>' : '<td class="masked">?</td>';
      });
      var nameVal = slot.solved ? slot.players[0].name : '???';
      cells += '<td class="name-col">' + nameVal + '</td>';
      tr.innerHTML = cells;
      body.appendChild(tr);
    });

    document.getElementById('page-indicator').textContent = (currentPage + 1) + ' / ' + totalPages();
    document.getElementById('prev-page').disabled = currentPage === 0;
    document.getElementById('next-page').disabled = currentPage >= totalPages() - 1;
  }

  function showFeedback(msg, ok) {
    var el = document.getElementById('feedback');
    el.textContent = msg;
    el.className = ok ? 'ok' : 'bad';
  }

  function submitGuess() {
    if (!current) return;
    var input = document.getElementById('guess-input');
    var raw = input.value.trim();
    if (!raw) return;
    var key = normalize(raw);
    var slotIds = current.nameToSlots[key];

    if (!slotIds) {
      showFeedback('"' + raw + '" 오답 또는 명단에 없음', false);
      input.value = '';
      input.focus();
      return;
    }

    var newlySolved = 0;
    var solvedIds = [];
    slotIds.forEach(function (sid) {
      var slot = current.def.slots.find(function (s) { return s.slot_id === sid; });
      if (slot && !slot.solved) {
        slot.solved = true;
        newlySolved++;
        solvedIds.push(sid);
      }
    });

    if (newlySolved === 0) {
      showFeedback('이미 맞힌 선수', false);
      input.value = '';
      return;
    }

    solvedCount += newlySolved;
    document.getElementById('solved-count').textContent = solvedCount;
    showFeedback('정답!', true);
    renderTable();
    solvedIds.forEach(function (sid) {
      var tr = document.getElementById('slot-' + sid);
      if (tr) tr.classList.add('flash-correct');
    });

    input.value = '';
    input.focus();

    if (solvedCount >= current.def.slots.length) {
      showFeedback('전부 맞혔다! ' + solvedCount + '/' + current.def.slots.length + ' 완료', true);
      document.getElementById('hint-btn').disabled = true;
    }
  }

  function useHint() {
    if (!current) return;
    if (hintCount >= MAX_HINTS) return;
    var hidden = current.def.hint_cols.filter(function (c) { return !revealedCols.has(c.key); });
    if (!hidden.length) {
      document.getElementById('hint-btn').disabled = true;
      return;
    }
    revealedCols.add(hidden[0].key);
    hintCount++;
    document.getElementById('hint-left').textContent = MAX_HINTS - hintCount;
    showFeedback('힌트: "' + hidden[0].label + '" 컬럼 공개', true);
    renderTable();
    if (hintCount >= MAX_HINTS) document.getElementById('hint-btn').disabled = true;
  }

  document.getElementById('guess-btn').addEventListener('click', submitGuess);
  document.getElementById('hint-btn').addEventListener('click', useHint);
  document.getElementById('guess-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submitGuess();
  });
  document.getElementById('prev-page').addEventListener('click', function () {
    if (currentPage > 0) { currentPage--; renderTable(); }
  });
  document.getElementById('next-page').addEventListener('click', function () {
    if (currentPage < totalPages() - 1) { currentPage++; renderTable(); }
  });

  loadData();
})();
</script>
</body>
</html>
