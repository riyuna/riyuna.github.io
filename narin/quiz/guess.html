<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나린봇 야구퀴즈 - 이 선수는 누구?</title>
  <style>
    :root {
      --bg: #07111f;
      --surface: #0d1f35;
      --card: #112844;
      --border: #1e3d5c;
      --accent: #4da6ff;
      --accent2: #7ec8ff;
      --text: #e8f4ff;
      --muted: #7aaac8;
      --dim: #4a7a9b;
      --good: #5cb85c;
      --bad: #e05c5c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; line-height: 1.6; }
    header { background: var(--surface); border-bottom: 2px solid var(--accent); padding: 1.2rem 2rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    header h1 { font-size: 1.4rem; color: var(--accent2); letter-spacing: 0.02em; }
    header a.back { color: var(--muted); text-decoration: none; font-size: 0.85rem; border: 1px solid var(--border); padding: 0.3rem 0.8rem; border-radius: 4px; margin-left: auto; }
    header a.back:hover { border-color: var(--accent); color: #fff; }
    .container { max-width: 820px; margin: 0 auto; padding: 1.6rem 1.2rem 3rem; }

    .intro { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.4rem; }
    .intro b { color: var(--accent2); }

    .session-stats { display: flex; gap: 1.4rem; font-size: 0.85rem; color: var(--muted); margin-bottom: 1.2rem; }
    .session-stats b { color: var(--text); }

    .filter-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .filter-row .filter-label { color: var(--muted); font-size: 0.85rem; }
    .filter-row select { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.7rem; color: var(--text); font-size: 0.9rem; }
    .filter-row select:focus { outline: none; border-color: var(--accent); }
    .filter-count { color: var(--dim); font-size: 0.8rem; }

    .clue-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.2rem 1.4rem; margin-bottom: 1.2rem; min-height: 120px; }
    .clue-panel .clue-empty { color: var(--dim); font-size: 0.9rem; }
    .clue-list { list-style: none; }
    .clue-list li { padding: 0.55rem 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
    .clue-list li:last-child { border-bottom: none; }
    .clue-list li .clue-num { color: var(--dim); font-size: 0.78rem; margin-right: 0.5rem; }
    .clue-list li.reveal-anim { animation: clueIn 0.35s ease; }
    @keyframes clueIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    .answer-banner { display: none; background: var(--card); border: 1px solid var(--accent); border-radius: 8px; padding: 0.9rem 1.1rem; margin-bottom: 1.2rem; }
    .answer-banner.show { display: block; }
    .answer-banner .name { font-size: 1.15rem; font-weight: bold; color: var(--accent2); }
    .answer-banner .meta { font-size: 0.85rem; color: var(--muted); margin-top: 0.2rem; }

    .guess-row { display: flex; gap: 0.6rem; margin-bottom: 0.8rem; flex-wrap: wrap; }
    .guess-row input { flex: 1 1 220px; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 0.65rem 0.9rem; color: var(--text); font-size: 0.95rem; }
    .guess-row input:focus { outline: none; border-color: var(--accent); }
    .guess-row button { background: var(--accent); border: none; border-radius: 6px; padding: 0.65rem 1.2rem; color: #07111f; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
    .guess-row button:hover { background: var(--accent2); }
    .guess-row button:disabled { opacity: 0.4; cursor: not-allowed; }

    .action-row { display: flex; gap: 0.6rem; margin-bottom: 0.8rem; flex-wrap: wrap; }
    .action-row button { background: var(--card); color: var(--accent2); border: 1px solid var(--border); border-radius: 6px; padding: 0.55rem 1rem; cursor: pointer; font-size: 0.85rem; }
    .action-row button:hover { border-color: var(--accent); }
    .action-row button.giveup-btn { color: var(--bad); }
    .action-row button.giveup-btn:hover { border-color: var(--bad); }
    .action-row button:disabled { opacity: 0.4; cursor: not-allowed; }
    .action-row button.next-btn { background: var(--accent); color: #07111f; font-weight: bold; border: none; }
    .action-row button.next-btn:hover { background: var(--accent2); }

    #feedback { min-height: 1.4rem; font-size: 0.88rem; margin-bottom: 0.6rem; }
    #feedback.ok { color: var(--good); font-weight: bold; }
    #feedback.bad { color: var(--bad); }

    .footer-note { color: var(--dim); font-size: 0.78rem; margin-top: 1.2rem; }
    footer { text-align: center; color: var(--dim); font-size: 0.8rem; padding: 2rem; border-top: 1px solid var(--border); margin-top: 2rem; }
  </style>
</head>
<body>
<header>
  <h1>⚾ 이 선수는 누구?</h1>
  <a class="back" href="/narin/quiz/">← 순위 맞히기로</a>
</header>

<div class="container">
  <p class="intro">
    힌트가 하나씩 나와요(포지션·소속팀 이력 → 가장 활약한 시즌 3개 → 활동기간 → 출신교·드래프트).
    아무 때나 이름을 맞혀보고, 막히면 "다음 힌트"를 눌러주세요.<br>
    데이터 기준일: <b id="snapshot-date">-</b>
  </p>

  <div class="filter-row">
    <span class="filter-label">팀:</span>
    <select id="team-filter"><option value="">전체</option></select>
  </div>
  <div class="filter-row">
    <span class="filter-label">데뷔:</span>
    <select id="debut-from"><option value="">전체</option></select>
    <span class="filter-label">~</span>
    <select id="debut-to"><option value="">전체</option></select>
  </div>
  <div class="filter-row">
    <span class="filter-label">은퇴(마지막 시즌):</span>
    <select id="retire-from"><option value="">전체</option></select>
    <span class="filter-label">~</span>
    <select id="retire-to"><option value="">전체</option></select>
    <span class="filter-count" id="filter-count"></span>
  </div>
  <p class="footer-note" id="retire-note" style="margin-bottom:1rem"></p>

  <div class="session-stats">
    <span>이번 세션 정답 <b id="session-solved">0</b>/<span id="session-total">0</span></span>
    <span>힌트 <b id="hint-used">0</b>개 사용</span>
  </div>

  <div class="clue-panel">
    <ul class="clue-list" id="clue-list"></ul>
  </div>

  <div class="answer-banner" id="answer-banner">
    <div class="name" id="answer-name"></div>
    <div class="meta" id="answer-meta"></div>
  </div>

  <div id="feedback"></div>

  <div class="guess-row">
    <input type="text" id="guess-input" placeholder="선수 이름 입력 후 Enter" autocomplete="off">
    <button id="guess-btn">제출</button>
  </div>

  <div class="action-row">
    <button id="hint-btn">다음 힌트 보기</button>
    <button id="giveup-btn" class="giveup-btn">포기하고 정답 보기</button>
    <button id="next-btn" class="next-btn" style="display:none">다음 문제 ▶</button>
  </div>

  <p class="footer-note">새로고침하면 세션 기록은 초기화돼요 (로컬 저장은 안 해요). 같은 선수는 전체 문제를 다 풀기 전까진 잘 안 겹치게 내요.</p>
</div>

<footer>
  나린봇 · KBO 야구 디스코드 봇 · <a href="https://github.com/riyuna/narin_bot" style="color:var(--accent)">GitHub</a>
</footer>

<script>
(function () {
  var DATA = null;
  var usedIds = [];
  var current = null; // player object
  var revealedCount = 0;
  var solved = false;
  var ended = false;
  var sessionSolved = 0;
  var sessionTotal = 0;
  var teamFilter = '';
  var debutFrom = '';
  var debutTo = '';
  var retireFrom = '';
  var retireTo = '';

  function normalize(name) {
    return name.replace(/\s+/g, '').toLowerCase();
  }

  function loadData() {
    return fetch('/narin/quiz/guess_player_data.json?t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (json) {
        DATA = json;
        document.getElementById('snapshot-date').textContent = json.generated_at || '-';
        populateFilters();
        nextQuestion();
      })
      .catch(function () {
        document.getElementById('clue-list').innerHTML = '<li class="clue-empty" style="color:var(--bad)">데이터를 불러오지 못했습니다.</li>';
      });
  }

  function fillYearSelect(selectEl, years, suffix) {
    years.forEach(function (y) {
      var opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y + suffix;
      selectEl.appendChild(opt);
    });
  }

  function populateFilters() {
    var teamSel = document.getElementById('team-filter');
    (DATA.all_teams || []).forEach(function (t) {
      var opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      teamSel.appendChild(opt);
    });

    fillYearSelect(document.getElementById('debut-from'), DATA.debut_years || [], '년');
    fillYearSelect(document.getElementById('debut-to'), DATA.debut_years || [], '년');
    fillYearSelect(document.getElementById('retire-from'), DATA.retire_years || [], '년');
    fillYearSelect(document.getElementById('retire-to'), DATA.retire_years || [], '년');

    document.getElementById('retire-note').textContent =
      '※ 은퇴(마지막 시즌) 범위 끝을 ' + DATA.current_season + '년으로 두면, 아직 은퇴 안 하고 ' +
      DATA.current_season + '년까지 뛴 현역 선수도 포함돼요.';
  }

  function filteredPool() {
    return DATA.players.filter(function (p) {
      if (teamFilter && p.teams.indexOf(teamFilter) === -1) return false;
      if (debutFrom && p.debut_year < parseInt(debutFrom, 10)) return false;
      if (debutTo && p.debut_year > parseInt(debutTo, 10)) return false;
      if (retireFrom && p.retire_year < parseInt(retireFrom, 10)) return false;
      if (retireTo && p.retire_year > parseInt(retireTo, 10)) return false;
      return true;
    });
  }

  function updateFilterCount(pool) {
    document.getElementById('filter-count').textContent =
      '조건에 맞는 선수 ' + pool.length + '명';
  }

  function pickPlayer() {
    var pool = filteredPool();
    updateFilterCount(pool);
    if (!pool.length) return null;
    if (usedIds.length >= pool.length) usedIds = [];
    var remaining = pool.filter(function (p) { return usedIds.indexOf(p.id) === -1; });
    var pick = remaining[Math.floor(Math.random() * remaining.length)];
    usedIds.push(pick.id);
    return pick;
  }

  function onFilterChange() {
    teamFilter = document.getElementById('team-filter').value;
    debutFrom = document.getElementById('debut-from').value;
    debutTo = document.getElementById('debut-to').value;
    retireFrom = document.getElementById('retire-from').value;
    retireTo = document.getElementById('retire-to').value;
    usedIds = [];
    nextQuestion();
  }

  function nextQuestion() {
    current = pickPlayer();
    if (!current) {
      document.getElementById('clue-list').innerHTML = '<li class="clue-empty">이 조건에 맞는 선수가 없어요. 필터를 바꿔보세요.</li>';
      document.getElementById('answer-banner').classList.remove('show');
      document.getElementById('guess-input').disabled = true;
      document.getElementById('guess-btn').disabled = true;
      document.getElementById('hint-btn').disabled = true;
      document.getElementById('giveup-btn').disabled = true;
      document.getElementById('next-btn').style.display = 'none';
      return;
    }
    revealedCount = 1;
    solved = false;
    ended = false;
    sessionTotal++;
    document.getElementById('session-total').textContent = sessionTotal;
    document.getElementById('answer-banner').classList.remove('show');
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = '';
    document.getElementById('guess-input').value = '';
    document.getElementById('guess-input').disabled = false;
    document.getElementById('guess-btn').disabled = false;
    document.getElementById('hint-btn').disabled = false;
    document.getElementById('giveup-btn').disabled = false;
    document.getElementById('next-btn').style.display = 'none';
    renderClues(true);
    document.getElementById('guess-input').focus();
  }

  function renderClues(animateLast) {
    var list = document.getElementById('clue-list');
    list.innerHTML = '';
    for (var i = 0; i < revealedCount; i++) {
      var li = document.createElement('li');
      if (animateLast && i === revealedCount - 1) li.classList.add('reveal-anim');
      li.innerHTML = '<span class="clue-num">힌트 ' + (i + 1) + '</span>' + current.clues[i];
      list.appendChild(li);
    }
  }

  function useHint() {
    if (!current || ended) return;
    if (revealedCount >= current.clues.length) {
      document.getElementById('hint-btn').disabled = true;
      return;
    }
    revealedCount++;
    document.getElementById('hint-used').textContent = parseInt(document.getElementById('hint-used').textContent, 10) + 1;
    renderClues(true);
    if (revealedCount >= current.clues.length) document.getElementById('hint-btn').disabled = true;
  }

  function endQuestion(reason) {
    if (!current || ended) return;
    ended = true;
    revealedCount = current.clues.length;
    renderClues(false);
    document.getElementById('guess-input').disabled = true;
    document.getElementById('guess-btn').disabled = true;
    document.getElementById('hint-btn').disabled = true;
    document.getElementById('giveup-btn').disabled = true;
    document.getElementById('next-btn').style.display = 'inline-block';

    var banner = document.getElementById('answer-banner');
    document.getElementById('answer-name').textContent = current.name;
    document.getElementById('answer-meta').textContent =
      reason === 'solved' ? ('정답! 힌트 ' + revealedHintsAtSolve + '개 만에 맞힘') : '정답 공개';
    banner.classList.add('show');
  }

  var revealedHintsAtSolve = 0;

  function submitGuess() {
    if (!current || ended) return;
    var input = document.getElementById('guess-input');
    var raw = input.value.trim();
    if (!raw) return;

    if (normalize(raw) === normalize(current.name)) {
      revealedHintsAtSolve = revealedCount;
      sessionSolved++;
      document.getElementById('session-solved').textContent = sessionSolved;
      showFeedback('정답!', true);
      endQuestion('solved');
    } else {
      showFeedback('"' + raw + '" 오답이에요', false);
    }
    input.value = '';
    input.focus();
  }

  function showFeedback(msg, ok) {
    var el = document.getElementById('feedback');
    el.textContent = msg;
    el.className = ok ? 'ok' : 'bad';
  }

  document.getElementById('guess-btn').addEventListener('click', submitGuess);
  document.getElementById('guess-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submitGuess();
  });
  document.getElementById('hint-btn').addEventListener('click', useHint);
  document.getElementById('giveup-btn').addEventListener('click', function () {
    if (!current || ended) return;
    if (confirm('정말 포기할까요? 정답이 바로 공개돼요.')) {
      endQuestion('giveup');
    }
  });
  document.getElementById('next-btn').addEventListener('click', nextQuestion);
  document.getElementById('team-filter').addEventListener('change', onFilterChange);
  document.getElementById('debut-from').addEventListener('change', onFilterChange);
  document.getElementById('debut-to').addEventListener('change', onFilterChange);
  document.getElementById('retire-from').addEventListener('change', onFilterChange);
  document.getElementById('retire-to').addEventListener('change', onFilterChange);

  loadData();
})();
</script>
</body>
</html>
